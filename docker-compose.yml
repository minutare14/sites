services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medusa_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgres://medusa:${POSTGRES_PASSWORD}@postgres:5432/medusa_db
      - REDIS_URL=redis://redis:6379
      - STORE_CORS=https://momo.minutarecore.space
      - ADMIN_CORS=https://api.momo.minutarecore.space
      - AUTH_CORS=https://api.momo.minutarecore.space
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dokploy-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.momo-backend.rule=Host(`api.momo.minutarecore.space`)"
      - "traefik.http.routers.momo-backend.entrypoints=web,websecure"
      - "traefik.http.routers.momo-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.momo-backend.loadbalancer.server.port=9000"

  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://api.momo.minutarecore.space
    ports:
      - "3344:3000"
    depends_on:
      - backend
    networks:
      - dokploy-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.momo-storefront.rule=Host(`momo.minutarecore.space`)"
      - "traefik.http.routers.momo-storefront.entrypoints=web,websecure"
      - "traefik.http.routers.momo-storefront.tls.certresolver=letsencrypt"
      - "traefik.http.services.momo-storefront.loadbalancer.server.port=3000"

networks:
  dokploy-network:
    external: true

volumes:
  postgres_data:
