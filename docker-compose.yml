services:
  backend:
    image: nginx:1.27-alpine
    depends_on:
      saleor-api:
        condition: service_started
      saleor-dashboard:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8100}:80"
    volumes:
      - ./infra/nginx/saleor.conf:/etc/nginx/conf.d/default.conf:ro

  saleor-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: saleor
      POSTGRES_PASSWORD: saleor
      POSTGRES_DB: saleor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleor -d saleor"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - saleor_db_data:/var/lib/postgresql/data

  saleor-cache:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    volumes:
      - saleor_cache_data:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  saleor-api:
    image: ghcr.io/saleor/saleor:3.22
    depends_on:
      saleor-db:
        condition: service_healthy
      saleor-cache:
        condition: service_started
      mailpit:
        condition: service_started
    env_file:
      - ./saleor/common.env
      - ./saleor/backend.env
    environment:
      ALLOWED_HOSTS: ${SALEOR_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,saleor-api,api.momo.minutarecore.space}
      DASHBOARD_URL: ${SALEOR_DASHBOARD_PUBLIC_URL:-http://localhost:8100/app/}
      PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8100/}
    volumes:
      - saleor_media:/app/media

  saleor-worker:
    image: ghcr.io/saleor/saleor:3.22
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    depends_on:
      saleor-db:
        condition: service_healthy
      saleor-cache:
        condition: service_started
      mailpit:
        condition: service_started
    env_file:
      - ./saleor/common.env
      - ./saleor/backend.env
    volumes:
      - saleor_media:/app/media

  saleor-dashboard:
    image: ghcr.io/saleor/saleor-dashboard:latest
    env_file:
      - ./saleor/dashboard.env
    environment:
      API_URL: ${SALEOR_GRAPHQL_PUBLIC_URL:-http://localhost:8100/graphql/}
      APP_MOUNT_URI: /app/
      BASE_URL: ${SALEOR_DASHBOARD_PUBLIC_URL:-http://localhost:8100/app/}

  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
      SALEOR_API_URL: http://backend/graphql/
      SALEOR_CHANNEL_SLUG: momo-br
      SALEOR_MEDIA_BASE_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8100/}
      NEXT_PUBLIC_SALEOR_DASHBOARD_URL: ${SALEOR_DASHBOARD_PUBLIC_URL:-http://localhost:8100/app/}
    ports:
      - "${STOREFRONT_PORT:-3300}:3000"

volumes:
  saleor_db_data:
  saleor_cache_data:
  saleor_media:
