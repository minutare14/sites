services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa_password
      POSTGRES_DB: medusa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    environment:
      - DATABASE_URL=postgres://medusa:medusa_password@postgres:5432/medusa_db
      - REDIS_URL=redis://redis:6379
    ports:
      - "9000:9000"
      - "7001:7001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
    volumes:
      - ./storefront:/app/storefront
      - /app/storefront/node_modules
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://backend:9000
    depends_on:
      - backend

volumes:
  postgres_data:
