services:
  backend:
    image: nginx:1.27-alpine
    depends_on:
      saleor-api:
        condition: service_healthy
      saleor-dashboard:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8100}:80"
    volumes:
      - ./infra/nginx/saleor.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

  saleor-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${SALEOR_DB_USER:-saleor}
      POSTGRES_PASSWORD: ${SALEOR_DB_PASSWORD:-saleor}
      POSTGRES_DB: ${SALEOR_DB_NAME:-saleor}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SALEOR_DB_USER:-saleor} -d ${SALEOR_DB_NAME:-saleor}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - saleor_db_data:/var/lib/postgresql/data
    networks:
      - dokploy-network

  saleor-cache:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    volumes:
      - saleor_cache_data:/data
    networks:
      - dokploy-network

  mailpit:
    image: ghcr.io/axllent/mailpit:latest
    ports:
      - "8025:8025"
    networks:
      - dokploy-network

  saleor-api:
    image: ghcr.io/saleor/saleor:3.22
    depends_on:
      saleor-db:
        condition: service_healthy
      saleor-cache:
        condition: service_started
      mailpit:
        condition: service_started
      saleor-migrate:
        condition: service_completed_successfully
    environment:
      CACHE_URL: ${CACHE_URL:-redis://saleor-cache:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://saleor-cache:6379/1}
      DATABASE_URL: ${DATABASE_URL:-postgres://${SALEOR_DB_USER:-saleor}:${SALEOR_DB_PASSWORD:-saleor}@saleor-db/${SALEOR_DB_NAME:-saleor}}
      DEFAULT_CHANNEL_SLUG: ${DEFAULT_CHANNEL_SLUG:-momo-br}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@momo.local}
      EMAIL_URL: ${EMAIL_URL:-smtp://mailpit:1025}
      HTTP_IP_FILTER_ALLOW_LOOPBACK_IPS: ${HTTP_IP_FILTER_ALLOW_LOOPBACK_IPS:-True}
      HTTP_IP_FILTER_ENABLED: ${HTTP_IP_FILTER_ENABLED:-True}
      SECRET_KEY: ${SECRET_KEY:-change-me-for-local-development}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,saleor-api,api.momo.minutarecore.space}
      DASHBOARD_URL: ${SALEOR_DASHBOARD_PUBLIC_URL:-http://localhost:8100/app/}
      PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8100/}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/graphql/', timeout=5).read()\""]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 90s
    volumes:
      - saleor_media:/app/media
    networks:
      - dokploy-network

  saleor-migrate:
    image: ghcr.io/saleor/saleor:3.22
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py shell < /app/bootstrap_saleor_admin.py"
    depends_on:
      saleor-db:
        condition: service_healthy
      saleor-cache:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      CACHE_URL: ${CACHE_URL:-redis://saleor-cache:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://saleor-cache:6379/1}
      DATABASE_URL: ${DATABASE_URL:-postgres://${SALEOR_DB_USER:-saleor}:${SALEOR_DB_PASSWORD:-saleor}@saleor-db/${SALEOR_DB_NAME:-saleor}}
      DEFAULT_CHANNEL_SLUG: ${DEFAULT_CHANNEL_SLUG:-momo-br}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@momo.local}
      EMAIL_URL: ${EMAIL_URL:-smtp://mailpit:1025}
      HTTP_IP_FILTER_ALLOW_LOOPBACK_IPS: ${HTTP_IP_FILTER_ALLOW_LOOPBACK_IPS:-True}
      HTTP_IP_FILTER_ENABLED: ${HTTP_IP_FILTER_ENABLED:-True}
      SECRET_KEY: ${SECRET_KEY:-change-me-for-local-development}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,saleor-api,api.momo.minutarecore.space}
      DASHBOARD_URL: ${SALEOR_DASHBOARD_PUBLIC_URL:-http://localhost:8100/app/}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_FIRST_NAME: ${DJANGO_SUPERUSER_FIRST_NAME:-}
      DJANGO_SUPERUSER_LAST_NAME: ${DJANGO_SUPERUSER_LAST_NAME:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8100/}
    volumes:
      - ./scripts/bootstrap_saleor_admin.py:/app/bootstrap_saleor_admin.py:ro
    networks:
      - dokploy-network

  saleor-worker:
    image: ghcr.io/saleor/saleor:3.22
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    depends_on:
      saleor-db:
        condition: service_healthy
      saleor-cache:
        condition: service_started
      mailpit:
        condition: service_started
      saleor-migrate:
        condition: service_completed_successfully
    environment:
      CACHE_URL: ${CACHE_URL:-redis://saleor-cache:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://saleor-cache:6379/1}
      DATABASE_URL: ${DATABASE_URL:-postgres://${SALEOR_DB_USER:-saleor}:${SALEOR_DB_PASSWORD:-saleor}@saleor-db/${SALEOR_DB_NAME:-saleor}}
      DEFAULT_CHANNEL_SLUG: ${DEFAULT_CHANNEL_SLUG:-momo-br}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@momo.local}
      EMAIL_URL: ${EMAIL_URL:-smtp://mailpit:1025}
      HTTP_IP_FILTER_ALLOW_LOOPBACK_IPS: ${HTTP_IP_FILTER_ALLOW_LOOPBACK_IPS:-True}
      HTTP_IP_FILTER_ENABLED: ${HTTP_IP_FILTER_ENABLED:-True}
      SECRET_KEY: ${SECRET_KEY:-change-me-for-local-development}
    volumes:
      - saleor_media:/app/media
    networks:
      - dokploy-network

  saleor-dashboard:
    image: ghcr.io/saleor/saleor-dashboard:latest
    environment:
      LOCALE_CODE: ${LOCALE_CODE:-EN}
      API_URL: ${SALEOR_GRAPHQL_PUBLIC_URL:-/graphql/}
      APP_MOUNT_URI: ${APP_MOUNT_URI:-/app/}
      BASE_URL: ${SALEOR_DASHBOARD_PUBLIC_URL:-/app/}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/app/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - dokploy-network

  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SALEOR_API_URL: http://backend/graphql/
      SALEOR_CHANNEL_SLUG: ${DEFAULT_CHANNEL_SLUG:-momo-br}
      SALEOR_MEDIA_BASE_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8100/}
      NEXT_PUBLIC_SALEOR_DASHBOARD_URL: ${SALEOR_DASHBOARD_PUBLIC_URL:-http://localhost:8100/app/}
      NEXT_PUBLIC_SHOW_ADMIN_LINK: ${NEXT_PUBLIC_SHOW_ADMIN_LINK:-false}
    ports:
      - "${STOREFRONT_PORT:-3300}:3000"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

volumes:
  saleor_db_data:
  saleor_cache_data:
  saleor_media:

networks:
  dokploy-network:
    external: true
