server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 ipv6=off valid=30s;

  client_max_body_size 20m;

  set $saleor_api http://saleor-api:8000;
  set $saleor_dashboard http://saleor-dashboard:80;

  location = / {
    return 302 /app/;
  }

  location = /app {
    return 301 /app/;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /app/ {
    proxy_pass $saleor_dashboard;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /dashboard/ {
    proxy_pass $saleor_dashboard;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /graphql {
    return 301 /graphql/;
  }

  location /graphql/ {
    proxy_pass $saleor_api/graphql/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /media/ {
    proxy_pass $saleor_api/media/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /thumbnail/ {
    proxy_pass $saleor_api/thumbnail/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /static/ {
    proxy_pass $saleor_api/static/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
